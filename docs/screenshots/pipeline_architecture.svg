<svg width="700" height="680" viewBox="0 0 700 680" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">

  <!-- Background -->
  <rect width="700" height="680" fill="#0d1117" rx="12"/>

  <!-- Section label: Ingestion -->
  <rect x="16" y="16" width="668" height="192" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="30" y="36" font-size="11" fill="#8b949e" font-weight="600" letter-spacing="1">INGESTION PIPELINE</text>

  <!-- Resume Upload -->
  <rect x="36" y="48" width="136" height="48" rx="6" fill="#0d2137" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="104" y="68" text-anchor="middle" font-size="12" fill="#79c0ff" font-weight="600">Resume Upload</text>
  <text x="104" y="84" text-anchor="middle" font-size="10" fill="#8b949e">PDF / DOC / DOCX</text>

  <!-- Job Description -->
  <rect x="528" y="48" width="136" height="48" rx="6" fill="#1a0d2e" stroke="#8957e5" stroke-width="1.5"/>
  <text x="596" y="68" text-anchor="middle" font-size="12" fill="#d2a8ff" font-weight="600">Job Description</text>
  <text x="596" y="84" text-anchor="middle" font-size="10" fill="#8b949e">plain text</text>

  <!-- Arrow Resume -> Extract -->
  <line x1="104" y1="96" x2="104" y2="114" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Arrow JD -> LLM Normalize -->
  <line x1="596" y1="96" x2="596" y2="114" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Extract + Chunk -->
  <rect x="36" y="114" width="136" height="48" rx="6" fill="#0d2137" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="104" y="134" text-anchor="middle" font-size="12" fill="#79c0ff" font-weight="600">Extract + Chunk</text>
  <text x="104" y="150" text-anchor="middle" font-size="10" fill="#8b949e">PdfPig · OpenXml</text>

  <!-- LLM Normalize JD -->
  <rect x="528" y="114" width="136" height="48" rx="6" fill="#1a0d2e" stroke="#8957e5" stroke-width="1.5"/>
  <text x="596" y="134" text-anchor="middle" font-size="12" fill="#d2a8ff" font-weight="600">LLM Normalize</text>
  <text x="596" y="150" text-anchor="middle" font-size="10" fill="#8b949e">gpt-4.1-mini → JSON</text>

  <!-- Arrows to dual store -->
  <line x1="104" y1="162" x2="104" y2="174" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M172 188 L282 188" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <path d="M596 162 L596 174 L418 174 L418 188" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- LLM Normalize Resume -->
  <rect x="36" y="174" width="136" height="48" rx="6" fill="#0d2137" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="104" y="194" text-anchor="middle" font-size="12" fill="#79c0ff" font-weight="600">LLM Normalize</text>
  <text x="104" y="210" text-anchor="middle" font-size="10" fill="#8b949e">gpt-4.1-mini → JSON</text>

  <!-- AI Search store -->
  <rect x="282" y="174" width="136" height="48" rx="6" fill="#0d1f2e" stroke="#388bfd" stroke-width="1.5"/>
  <text x="350" y="194" text-anchor="middle" font-size="12" fill="#58a6ff" font-weight="600">Azure AI Search</text>
  <text x="350" y="210" text-anchor="middle" font-size="10" fill="#8b949e">hybrid index · embeddings</text>

  <!-- Neo4j store -->
  <rect x="282" y="174" width="136" height="48" rx="6" fill="#0d2e1a" stroke="#3fb950" stroke-width="1.5" x="422" y="174"/>
  <rect x="422" y="174" width="136" height="48" rx="6" fill="#0d2e1a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="490" y="194" text-anchor="middle" font-size="12" fill="#56d364" font-weight="600">Neo4j Graph DB</text>
  <text x="490" y="210" text-anchor="middle" font-size="10" fill="#8b949e">candidates + jobs</text>

  <!-- Divider -->
  <line x1="30" y1="228" x2="670" y2="228" stroke="#21262d" stroke-width="1"/>
  <text x="350" y="244" text-anchor="middle" font-size="10" fill="#8b949e" letter-spacing="0.5">HR QUERY ENGINE — POST /ask-me/{job_id}</text>

  <!-- HR Query -->
  <rect x="246" y="254" width="208" height="44" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="350" y="272" text-anchor="middle" font-size="12" fill="#ffa657" font-weight="600">HR Natural Language Query</text>
  <text x="350" y="288" text-anchor="middle" font-size="10" fill="#8b949e">POST /ask-me/{job_id}</text>

  <line x1="350" y1="298" x2="350" y2="314" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Sub-query Generator -->
  <rect x="246" y="314" width="208" height="44" rx="6" fill="#0d2137" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="350" y="332" text-anchor="middle" font-size="12" fill="#79c0ff" font-weight="600">Sub-query Generator</text>
  <text x="350" y="348" text-anchor="middle" font-size="10" fill="#8b949e">LLM decomposes JD into terms</text>

  <!-- Fork arrows -->
  <path d="M350 358 L350 370 L162 370 L162 382" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <path d="M350 358 L350 370 L538 370 L538 382" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- Hybrid Search -->
  <rect x="72" y="382" width="180" height="48" rx="6" fill="#0d1f2e" stroke="#388bfd" stroke-width="1.5"/>
  <text x="162" y="402" text-anchor="middle" font-size="12" fill="#58a6ff" font-weight="600">Hybrid Search</text>
  <text x="162" y="418" text-anchor="middle" font-size="10" fill="#8b949e">50-KNN + BM25 · multi-epoch</text>

  <!-- Candidate Ranker -->
  <rect x="448" y="382" width="180" height="48" rx="6" fill="#0d2e1a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="538" y="402" text-anchor="middle" font-size="12" fill="#56d364" font-weight="600">Candidate Ranker</text>
  <text x="538" y="418" text-anchor="middle" font-size="10" fill="#8b949e">skill weight · recency · exp</text>

  <!-- Join arrows -->
  <path d="M162 430 L162 452 L350 452 L350 460" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <path d="M538 430 L538 452 L350 452 L350 460" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- Filter + Score Boost -->
  <rect x="220" y="460" width="260" height="48" rx="6" fill="#2e1a0d" stroke="#f0883e" stroke-width="1.5"/>
  <text x="350" y="480" text-anchor="middle" font-size="12" fill="#ffa657" font-weight="600">Filter + Score Boost</text>
  <text x="350" y="496" text-anchor="middle" font-size="10" fill="#8b949e">resume_id join · top 25 · noise drop</text>

  <line x1="350" y1="508" x2="350" y2="524" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LLM Cypher -->
  <rect x="220" y="524" width="260" height="48" rx="6" fill="#1a0d2e" stroke="#8957e5" stroke-width="1.5"/>
  <text x="350" y="544" text-anchor="middle" font-size="12" fill="#d2a8ff" font-weight="600">LLM → Cypher → Neo4j</text>
  <text x="350" y="560" text-anchor="middle" font-size="10" fill="#8b949e">graph knowledge retrieval</text>

  <line x1="350" y1="572" x2="350" y2="588" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Grounded Response -->
  <rect x="220" y="588" width="260" height="52" rx="6" fill="#1a2d1a" stroke="#3fb950" stroke-width="2"/>
  <text x="350" y="609" text-anchor="middle" font-size="12" fill="#56d364" font-weight="700">Grounded HR Response</text>
  <text x="350" y="627" text-anchor="middle" font-size="10" fill="#8b949e">chunks + graph + LLM reasoning</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="36" y="650" width="12" height="12" rx="2" fill="#0d2137" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="54" y="661" font-size="10" fill="#8b949e">.NET / Azure</text>
  <rect x="130" y="650" width="12" height="12" rx="2" fill="#0d2e1a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="148" y="661" font-size="10" fill="#8b949e">Neo4j</text>
  <rect x="196" y="650" width="12" height="12" rx="2" fill="#1a0d2e" stroke="#8957e5" stroke-width="1.5"/>
  <text x="214" y="661" font-size="10" fill="#8b949e">OpenAI</text>
  <rect x="266" y="650" width="12" height="12" rx="2" fill="#2e1a0d" stroke="#f0883e" stroke-width="1.5"/>
  <text x="284" y="661" font-size="10" fill="#8b949e">Orchestration</text>
</svg>
